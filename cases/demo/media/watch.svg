<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 280" width="240" height="280">
  <rect width="240" height="280" fill="#f5e6d3"/>
  <!-- chain loop -->
  <circle cx="120" cy="34" r="16" fill="none" stroke="#8c8c8c" stroke-width="6"/>
  <rect x="108" y="46" width="24" height="22" rx="5" fill="#9a9a9a" stroke="#555" stroke-width="2"/>
  <!-- case -->
  <circle cx="120" cy="160" r="96" fill="#b9b9b9" stroke="#555" stroke-width="4"/>
  <circle cx="120" cy="160" r="84" fill="#fdfaf2" stroke="#777" stroke-width="3"/>
  <!-- hour marks -->
  <g stroke="#2a160c" stroke-width="3" stroke-linecap="round">
    <line x1="120" y1="84" x2="120" y2="96"/>
    <line x1="196" y1="160" x2="184" y2="160"/>
    <line x1="120" y1="236" x2="120" y2="224"/>
    <line x1="44" y1="160" x2="56" y2="160"/>
  </g>
  <g stroke="#2a160c" stroke-width="2" stroke-linecap="round">
    <line x1="158" y1="94.2" x2="155" y2="99.4"/>
    <line x1="185.8" y1="122" x2="180.6" y2="125"/>
    <line x1="185.8" y1="198" x2="180.6" y2="195"/>
    <line x1="158" y1="225.8" x2="155" y2="220.6"/>
    <line x1="82" y1="225.8" x2="85" y2="220.6"/>
    <line x1="54.2" y1="198" x2="59.4" y2="195"/>
    <line x1="54.2" y1="122" x2="59.4" y2="125"/>
    <line x1="82" y1="94.2" x2="85" y2="99.4"/>
  </g>
  <!-- hands: twenty past nine -->
  <line x1="120" y1="160" x2="76" y2="156" stroke="#2a160c" stroke-width="5" stroke-linecap="round"/>
  <line x1="120" y1="160" x2="170" y2="190" stroke="#2a160c" stroke-width="3" stroke-linecap="round"/>
  <circle cx="120" cy="160" r="5" fill="#2a160c"/>
  <!-- engraving -->
  <text x="120" y="130" text-anchor="middle" font-family="Georgia, serif" font-style="italic" font-size="20" fill="#7a5c3a">M.R.</text>
</svg>
